services:
  - type: web
    name: errtrack-site
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: errtrack-db
          property: connectionString
      - key: MASTER_PASSWORD
        sync: false
      - key: MULTI_PASSWORD
        sync: false
      - key: GESTAO_PASSWORD
        sync: false

databases:
  - name: errtrack-db
    plan: starter
